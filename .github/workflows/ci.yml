name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          extensions: bcmath, zip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit and contract tests
        run: |
          php tests/money_test.php
          php tests/contract_test.php
      - name: JavaScript syntax
        run: |
          node --check public/client-level-admin.js
          node --check public/client-level-client.js
      - name: Open-source release audit
        run: php tools/open_source_audit.php
      - name: Build and inspect install package
        run: |
          php tools/build_release.php
          php tools/build_github_source.php
          unzip -t dist/idcsmart_client_level_v1.6.3_zjmf_v10_import.zip
          unzip -t dist/idcsmart_client_level_v1.6.3_github_source.zip
