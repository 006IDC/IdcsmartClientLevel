name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, zip
          coverage: none

      - name: Verify and build release assets
        run: |
          php tests/money_test.php
          php tests/contract_test.php
          php tools/open_source_audit.php
          php tools/build_release.php
          php tools/build_github_source.php
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          unzip -tq dist/*_zjmf_v10_import.zip

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/idcsmart_client_level.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest install-package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*_zjmf_v10_import.zip
          sbom-path: dist/idcsmart_client_level.spdx.json

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create or update GitHub release
        run: |
          gh release view "$RELEASE_REF" >/dev/null 2>&1 || \
            gh release create "$RELEASE_REF" --verify-tag --generate-notes
          gh release upload "$RELEASE_REF" dist/* --clobber
